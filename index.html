<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kawaii Photobooth</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- PASSCODE LOCK SCREEN -->
  <div id="lock-screen" class="overlay">
    <div class="lock-box">
      <h2>🔒 Secret Photobooth</h2>
      <p>Enter secret code to enter:</p>
      <input type="password" id="passcode-input" placeholder="Type secret code..." />
      <button id="unlock-btn">Unlock ✨</button>
      <p id="lock-error" class="error-msg hidden">Wrong secret code! Try again 💖</p>
    </div>
  </div>

  <!-- MAIN PHOTOBOOTH CONTAINER -->
  <div class="photobooth-cabinet">
    
    <!-- GREEN HEADER BANNER -->
    <div class="header-card">
      <div class="letter-blocks top-row">
        <span>P</span><span>H</span><span>O</span><span>T</span><span>O</span>
      </div>
      <div class="letter-blocks bottom-row">
        <span>B</span><span>O</span><span>O</span><span>T</span><span>H</span>
      </div>
      <div class="stars">★ ★ ★</div>
    </div>

    <!-- TILTED BADGE -->
    <div class="tape-badge">Let's make memories together</div>

    <!-- PRICE / INFO SECTION -->
    <div class="price-section">
      <div class="mini-price-tag">🎟️ $1.00</div>
      <div class="info-badge">4x PHOTOS</div>
    </div>

    <!-- START BUTTON -->
    <button id="start-btn" class="coin-btn">CLICK HERE TO TAKE PICTURES!</button>

    <!-- CAMERA DISPLAY BOX -->
    <div class="camera-screen-container">
      <div class="screen-frame">
        <video id="webcam" autoplay playsinline muted></video>
        <div id="countdown-overlay" class="hidden">3</div>
      </div>
      
      <!-- REAL-TIME THUMBNAILS DISPLAYED IN THE SCREEN BAR -->
      <div class="screen-footer">
        <p id="screen-status-text">SMILE! 📸</p>
        <div id="live-thumbnails" class="thumbnail-strip"></div>
      </div>
    </div>

    <!-- HIDDEN CANVAS FOR COMPOSITING -->
    <canvas id="photo-canvas" class="hidden"></canvas>
  
 <!-- RESULT MODAL -->
  <div id="result-modal" class="overlay hidden">
    <div class="modal-box">
      <h2>Customize Your Strip! ✨</h2>
      
      <div class="theme-selector">
        <label for="theme-select">Choose Frame Style:</label>
        <select id="theme-select">
          <option value="template1">🐰 Judy & Nick (Zootopia)</option>
          <option value="template2">🧸 Polaroid & Snoopy</option>
          <option value="template3">🐱 Gingham Cat Scrapbook</option>
          <option value="template4">🍓 Strawberry Cat Ribbons</option>
          <option value="template5">🎀 Vintage Kawaii</option>
          <option value="template6">🧸 Red Teddy Scrapbook</option>
          <option value="template7">🎀 Pink Gingham Ribbon</option>
        </select>
      </div>

      <div id="strip-container"></div>

      <div class="modal-actions">
        <button id="download-btn">Download Strip 📸</button>
        <button id="retake-btn">Retake Photos 🔄</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
